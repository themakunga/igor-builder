name: Release plugin

on:
  push:
    branches:
      - "release/v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Validate version and build package
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#release/}"
          python scripts/check_plugin.py --tag "$VERSION" --package
      - name: Extract version notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("release/v")
          text = Path("release.md").read_text()
          notes = text.split(f"## {version}\n", 1)[1].split("\n## ", 1)[0].strip()
          if not notes:
              raise SystemExit("Release notes must not be empty")
          Path("dist/notes.md").write_text(notes + "\n")
          PY
      - name: Publish ZIP and checksum to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#release/}"
          gh release create "$VERSION" \
            "dist/igor-builder-${VERSION#v}.zip" dist/SHA256SUMS \
            --title "igor-builder $VERSION" \
            --notes-file dist/notes.md
