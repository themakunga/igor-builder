name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install development tools
        run: |
          npm ci
          python -m pip install -r requirements-dev.txt
      - name: Quality, lint, SAST and secrets in files
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Scan secrets across Git history
        run: |
          git clone --depth 1 --branch v8.30.1 https://github.com/gitleaks/gitleaks.git "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          go build -o "$RUNNER_TEMP/gitleaks-bin" .
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks-bin" git --redact --no-banner .
      - name: Audit dependencies
        run: |
          npm audit --audit-level=low
          pip-audit -r requirements-dev.txt
      - name: Verify release package
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/check_plugin.py --package
